<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>PWA catalog</title>
    <style>
      body {
        max-width: 480px;
        margin: 0 auto;
      }
    </style>
    <script defer src="index.js"></script>
  </head>
  <body>
    <h1>PWA install catalog</h1>

    <p>
      The following buttons install PWAs from different locations using the
      <code>&lt;install&gt;</code> element.
    </p>

    <ol>
      <li>
        <p>
          Install the Fox pictures app:
          <install
            manifest="https://mdn.github.io/pwa-examples/a2hs/manifest.webmanifest"
            manifestId="https://mdn.github.io/pwa-examples/a2hs/index.html"
            >Install fox pictures</install
          >
        </p>
      </li>
      <li>
        <p>
          Install the CycleTracker app:
          <install
            manifest="https://mdn.github.io/pwa-examples/cycletracker/service_workers/cycletracker.json"
            manifestId="https://mdn.github.io/pwa-examples/cycletracker/service_workers/"
            >Install CycleTracker</install
          >
        </p>
      </li>
      <li>
        <p>
          Install the PWinter app:
          <install
            manifest="https://diek.us/pwinter/manifest.json"
            manifestId="https://diek.us/pwinter/index.html?randomize=true"
            >Install PWinter</install
          >
        </p>
      </li>
    </ol>
  </body>
</html>
