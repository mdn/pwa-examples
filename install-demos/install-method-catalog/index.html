<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>PWA catalog</title>
    <style>
      body {
        max-width: 480px;
        margin: 0 auto;
      }
    </style>
    <script defer src="index.js"></script>
  </head>
  <body>
    <h1>PWA install catalog</h1>

    <p>
      The following buttons install PWAs from different locations using the
      <code>Navigator.install()</code> method.
    </p>

    <ol>
      <li>
        <p>
          Install the Fox pictures app:
          <button class="install" id="install1">Install fox pictures</button>
        </p>
      </li>
      <li>
        <p>
          Install the CycleTracker app:
          <button class="install" id="install2">Install CycleTracker</button>
        </p>
      </li>
      <li>
        <p>
          Install the PWinter app:
          <button class="install" id="install3">Install PWinter</button>
        </p>
      </li>
    </ol>
  </body>
</html>
